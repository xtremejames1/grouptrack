services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src
    environment:
      DATABASE_URL: postgresql+psycopg://grouptrack:grouptrack@db:5432/grouptrack
      SESSION_SIGNING_KEY: dev-signing-key
      SEED_DEMO: "true"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
