name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend deps
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend tests
        run: PYTHONPATH=backend/src pytest -q tests/unit tests/integration tests/e2e
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Docker build images
        run: docker build -f backend/Dockerfile . && docker build -f frontend/Dockerfile .
