services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grouptrack
      POSTGRES_USER: grouptrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grouptrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grouptrack -d grouptrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: grouptrack-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
      SEED_DEMO: "true"
      NUDGE_AUTOMATION_ENABLED: "false"
      APP_ENV: prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: grouptrack-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  pgdata:
