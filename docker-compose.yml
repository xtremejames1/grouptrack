services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grouptrack
      POSTGRES_USER: grouptrack
      POSTGRES_PASSWORD: grouptrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grouptrack -d grouptrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://grouptrack:grouptrack@db:5432/grouptrack
      SESSION_SIGNING_KEY: dev-signing-key
      SEED_DEMO: "true"
      NUDGE_AUTOMATION_ENABLED: "false"
      APP_ENV: dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
